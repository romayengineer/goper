version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - gocyclo
    - errcheck
    - ineffassign
    - unused
    - gocritic
    - gosec
    - prealloc

  settings:
    gocyclo:
      # min-complexity is the maximum allowed complexity.
      min-complexity: 7

formatters:
  default: none
  enable:
    - gofmt
