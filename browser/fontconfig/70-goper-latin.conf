<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Prefer fast Latin fonts for the generic families. The Playwright base
  image's fontconfig rules (60-latin.conf prefers missing DejaVu fonts,
  64-wqy-zenhei.conf prefers the huge CJK WenQuanYi Zen Hei for ALL
  sans-serif text) make Chrome rasterize every Latin glyph — including
  search-bar typing — with a multi-MB CJK font on a CPU-only renderer.
  That is a major source of input lag in the windowed/transparent setup.

  This file sorts after the image's own rules and strong-prepends the
  lightweight Liberation fonts, so Latin text renders fast while CJK
  glyphs still resolve through the lang-scoped rule in 75-wqy-cjk.conf.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Mono</string></edit>
  </match>
</fontconfig>
