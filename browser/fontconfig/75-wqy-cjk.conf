<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Keep CJK glyphs resolving to WenQuanYi Zen Hei (the only CJK font in the
  image) but ONLY for zh-language text, so it does not slow down Latin
  rendering (see 70-goper-latin.conf). Sorts after the Latin rule so the
  zh-scoped prepend wins for zh patterns.
-->
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>WenQuanYi Zen Hei</string></edit>
  </match>
</fontconfig>
