services:
  goper:
    build:
      context: .
      dockerfile: Dockerfile
    cap_add:
      - NET_ADMIN
    networks:
      - intercepted
      - upstream
    ports:
      - "8081:8081"
    volumes:
      - goper-ca:/home/goper/.goper/ca
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/stats"]
      interval: 5s
      timeout: 3s
      retries: 5

  browser-app:
    build: ./browser
    network_mode: "service:goper"
    depends_on:
      goper:
        condition: service_healthy
    volumes:
      - ./ca-cert.pem:/usr/local/share/ca-certificates/goper.crt

networks:
  intercepted:
    driver: bridge
  upstream:
    driver: bridge

volumes:
  goper-ca:
