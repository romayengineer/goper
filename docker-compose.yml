services:
  goper:
    build:
      context: .
      dockerfile: Dockerfile
    cap_add:
      - NET_ADMIN # install iptables REDIRECT rules for transparent interception
    networks: [goper-net]
    ports:
      - "8080:8080" # proxy (host access for debugging)
      - "8081:8081" # API + CA download
      - "9222:9222" # Chrome DevTools Protocol (Playwright connectOverCDP)
    volumes:
      - goper-ca:/home/goper/.goper/ca
      - ./captures:/home/goper/captures # JSON response bodies land here on the host
    command: ["--transparent", "--ca-dir", "/home/goper/.goper/ca", "--output-dir", "/home/goper/captures", "--output-format", "json"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/stats"]
      interval: 5s
      timeout: 3s
      retries: 10

  chrome:
    build: ./browser
    # Shares goper's network namespace: goper's iptables rules redirect this
    # service's traffic to the proxy with zero application configuration.
    network_mode: "service:goper"
    security_opt:
      - seccomp:unconfined # Chrome sandbox needs user namespaces (blocked by Docker's default seccomp)
    environment:
      # macOS/XQuartz: host.docker.internal:0 (TCP). Linux: uses the exported
      # DISPLAY (unix socket via /tmp/.X11-unix); prerequisite: xhost +local:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      # Suppress Chromium's "Google API keys are missing" banner (stock
      # Chromium ships without keys). Placeholder value only; Google-API-bound
      # features (e.g. Safe Browsing) are intentionally disabled.
      - GOOGLE_API_KEY=goper-placeholder
    volumes:
      - goper-ca:/certs:ro # goper's CA for trust installation
      - /tmp/.X11-unix:/tmp/.X11-unix
    depends_on:
      goper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9222/json/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  goper-net:

volumes:
  goper-ca:
